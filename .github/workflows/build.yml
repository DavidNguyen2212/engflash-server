name: CI/CD to Render + Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & cache Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '22' # nên dùng stable LTS
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 👉 Tự động release bằng semantic-release
      - name: Release with semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 👉 Tiếp tục deploy sau khi release thành công
      - name: Build app
        run: yarn build

      - name: Deploy to Render
        if: github.event_name == 'push'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -X POST https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json"

      # 👉 Cập nhật badge version (optional)
      - name: Update badges in README
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_BADGE="https://img.shields.io/badge/version-${VERSION}-blue.svg"
          RELEASE_BADGE="https://img.shields.io/badge/release-${VERSION}-green.svg"
          RELEASE_LINK="https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"

          sed -i.bak -E \
            "s|(<!-- VERSION BADGE -->).*|\1 ![version](${VERSION_BADGE})|" \
            README.md
          sed -i.bak -E \
            "s|(<!-- RELEASE BADGE -->).*|\1 [![release](${RELEASE_BADGE})](${RELEASE_LINK})|" \
            README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update badges to v${VERSION}" || echo "No changes to commit"
          git push origin HEAD:master
